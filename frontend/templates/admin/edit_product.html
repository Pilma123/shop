<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - KramLill</title>
</head>
<body>
    <header>
        <nav>
            <a href="/admin/dashboard">&larr; Back to Dashboard</a>
        </nav>
    </header>
    <main style="max-width: 600px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
        <h2>Edit Product: {{ product.name }}</h2>
        <form method="POST" enctype="multipart/form-data">
            <div style="margin-bottom: 15px;">
                <label for="name">Product Name (Required):</label><br>
                <input type="text" id="name" name="name" value="{{ product.name }}" required style="width: 100%;">
            </div>
            
            <div style="margin-bottom: 15px;">
                <label for="description">Description:</label><br>
                <textarea id="description" name="description" rows="4" style="width: 100%;">{{ product.description }}</textarea>
            </div>
            
            <div style="margin-bottom: 15px; display: flex; gap: 20px;">
                <div style="flex: 1;">
                    <label for="price">Price ($) (Required):</label><br>
                    <input type="number" id="price" name="price" step="0.01" min="0" value="{{ product.price }}" required style="width: 100%;">
                </div>
                <div style="flex: 1;">
                    <label for="stock">Stock Quantity:</label><br>
                    <input type="number" id="stock" name="stock" min="0" value="{{ product.stock }}" required style="width: 100%;">
                </div>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label for="image">Replace Product Image (Optional):</label><br>
                {% if product.image_filename %}
                    <div style="margin-bottom: 10px;">
                        <span style="font-size: 0.9em; color: #555;">Current image:</span><br>
                        <img id="current-image-preview" src="{{ url_for('static', filename='uploads/' + product.image_filename) }}" alt="{{ product.name }}" style="max-width: 150px; border: 1px solid #ccc; margin-top: 5px; display: block; margin-bottom: 5px; transition: opacity 0.3s ease;">
                        <label style="color: #dc3545; font-size: 0.9em; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;">
                            <input type="checkbox" id="delete_image" name="delete_image" value="1" onchange="if(this.checked) document.getElementById('current-image-preview').style.opacity = '0.3'; else document.getElementById('current-image-preview').style.opacity = '1';">
                            Remove current image
                        </label>
                    </div>
                {% endif %}
                <input type="file" id="image" name="image" accept="image/*" onchange="const file = this.files[0]; if (file) { const img = document.getElementById('new-preview-el') || document.getElementById('current-image-preview'); img.src = URL.createObjectURL(file); if (img.id === 'new-preview-el') img.style.display = 'block'; }">
                {% if not product.image_filename %}
                    <img id="new-preview-el" style="max-width: 150px; border: 1px solid #ccc; margin-top: 10px; display: none;" alt="Preview">
                {% endif %}
            </div>
            
            <div style="margin-bottom: 15px;">
                <label for="where_to_get">Where to get it:</label><br>
                <textarea id="where_to_get" name="where_to_get" rows="2" style="width: 100%;">{{ product.where_to_get }}</textarea>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label for="instagram_url">Instagram Post/Profile Link:</label><br>
                <input type="url" id="instagram_url" name="instagram_url" value="{{ product.instagram_url or '' }}" style="width: 100%;">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label for="phone">Phone Contact Number:</label><br>
                <input type="text" id="phone" name="phone" value="{{ product.phone or '' }}" style="width: 100%;">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label for="category">Category / Pinned Placement:</label><br>
                <select id="category" name="category" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="Normal" {% if product.category == 'Normal' %}selected{% endif %}>Normal (Bottom Catalog Grid)</option>
                    <option value="Pinned 1" {% if product.category == 'Pinned 1' %}selected{% endif %}>Pinned Slot 1 (Left Background Outline)</option>
                    <option value="Pinned 2" {% if product.category == 'Pinned 2' %}selected{% endif %}>Pinned Slot 2 (Center Background Outline)</option>
                    <option value="Pinned 3" {% if product.category == 'Pinned 3' %}selected{% endif %}>Pinned Slot 3 (Right Background Outline)</option>
                </select>
            </div>
            
            <button type="submit" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">Save Changes</button>
        </form>
    </main>
</body>
</html>
