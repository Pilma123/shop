<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - KramLill</title>
</head>
<body>
    <nav>
        <a href="/">Home</a> | <a href="/products">Products</a>
    </nav>
    <main style="max-width: 400px; margin: 50px auto;">
        <h2>Admin Login</h2>
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div style="margin-bottom: 10px;">
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username" required style="width: 100%;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required style="width: 100%;">
            </div>
            <button type="submit" style="width: 100%; padding: 8px;">Login</button>
        </form>
    </main>
</body>
</html>
